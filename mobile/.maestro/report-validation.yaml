# The report form is a four-step wizard; a step won't move on until its fields are filled in.
appId: com.transitx.app
name: Report form checks each step
---
- launchApp:
    clearState: true
- tapOn: "Skip"
- tapOn: "Report an incident"
- assertVisible: "Step 1 of 4"
- tapOn: "Continue"
- assertVisible: "Required."
- tapOn: "NB-1234"
- inputText: "NB-1234"
- tapOn: "08 or Colombo–Matale"
- inputText: "08"
- tapOn: "Private bus"
- tapOn: "Continue"
- assertVisible: "Step 2 of 4"
- tapOn: "Reckless / dangerous driving"
- assertVisible: "Step 3 of 4"
