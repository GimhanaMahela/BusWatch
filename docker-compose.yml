services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - .env # the single repo-root .env (see .env.example)
    environment:
      NODE_ENV: production
      PORT: 5000 # nginx in the ui image proxies /api to api:5000
      DATABASE_URL: postgres://buswatch:buswatch@postgres:5432/buswatch
      FRONTEND_URL: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
      args:
        # Read from the root .env; empty = same-origin /api through nginx
        VITE_MAPS_API_KEY: ${VITE_MAPS_API_KEY:-}
    ports:
      - "3000:80"
    depends_on:
      - api

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: buswatch
      POSTGRES_PASSWORD: buswatch
      POSTGRES_DB: buswatch
    ports:
      # Host port 5440 (override with POSTGRES_HOST_PORT) to avoid clashing with other local Postgres instances
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5440}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buswatch -d buswatch"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
