services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - .env # the single repo-root .env (see .env.example)
    environment:
      NODE_ENV: production
      PORT: 5000 # nginx in the ui image proxies /api to api:5000
      MONGO_URI: mongodb://mongodb:27017/buswatchdb
      FRONTEND_URL: http://localhost:3000
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
      args:
        # Read from the root .env; empty = same-origin /api through nginx
        VITE_MAPS_API_KEY: ${VITE_MAPS_API_KEY:-}
    ports:
      - "3000:80"
    depends_on:
      - api

  mongodb:
    # mongo:8 cannot start on Linux kernel >= 6.19 (SERVER-121912); stay on 7 until that is fixed
    image: mongo:7
    ports:
      - "27017:27017" # Optional: for connecting with Compass
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
