services:
  api:
    build: ./api
    ports:
      - "5000:5000"
    env_file:
      - ./api/.env # JWT_SECRET, ADMIN_*, CLOUDINARY_*, EMAIL_* (see .env.example)
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/buswatchdb
      CORS_ORIGINS: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  ui:
    build:
      context: ./ui
      args:
        # Called from the browser, so this is the host-mapped backend port
        VITE_BACKEND_URL: http://localhost:5000/api
    ports:
      - "3000:80"
    depends_on:
      - api

  mongodb:
    image: mongo:8
    ports:
      - "27017:27017" # Optional: for connecting with Compass
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
