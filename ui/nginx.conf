# Rendered by the nginx image's envsubst step (/etc/nginx/templates), so ${API_UPSTREAM} is filled in
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Same-origin API: forward /api to the API container
  location /api/ {
    proxy_pass ${API_UPSTREAM};
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 80m; # report media uploads
  }

  # Hashed build assets never change, so cache them for a year
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA routing: unknown paths go to index.html so React Router can handle them
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
